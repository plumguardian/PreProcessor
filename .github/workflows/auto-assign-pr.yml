name: Auto assign PR

permissions:
  pull-requests: write

on:
  pull_request_target:
    types:
      - opened

jobs:
  assign-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Assign PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --add-assignee "plumguardian"
